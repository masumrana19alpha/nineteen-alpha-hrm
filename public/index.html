<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>19 Alpha BMS — Business Management System</title>
  <!-- Tailwind CSS CDN (এটি ছাড়া ডিজাইন লোড হবে না) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <!-- Login View -->
  <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-xl shadow-md border border-slate-200 p-6">
      <div class="mb-6">
        <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600">Nineteen Alpha</span>
        <h1 class="text-2xl font-bold text-slate-900 mt-1">19 Alpha BMS</h1>
        <p class="text-sm text-slate-500 mt-1">Sign in to access operations, projects, finance &amp; ERP modules.</p>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Username or Email</label>
          <input
            id="username"
            type="text"
            required
            placeholder="admin@nineteenalpha.com"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input
            id="password"
            type="password"
            required
            placeholder="••••••••"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>
        <p id="login-error" class="text-sm text-red-600 hidden"></p>
        <button
          type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition"
        >
          Sign In
        </button>
      </form>
    </div>
  </div>

  <!-- App Shell -->
  <div id="app-view" class="hidden min-h-screen flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-slate-200 flex flex-col justify-between shrink-0">
      <div>
        <div class="px-5 py-4 border-b border-slate-800">
          <div class="text-xs uppercase tracking-wider text-indigo-400 font-semibold">Nineteen Alpha</div>
          <div class="text-lg font-bold text-white">19 Alpha BMS</div>
        </div>
        <nav id="nav-menu" class="p-3 space-y-1 text-sm">
          <button data-tab="dashboard" class="nav-btn w-full text-left px-3 py-2 rounded-lg bg-indigo-600 text-white font-medium">
            Executive Dashboard
          </button>
          <button data-tab="hr" class="nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800">
            HR &amp; Payroll
          </button>
          <button data-tab="projects" class="nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800">
            Projects (incl. Defence)
          </button>
          <button data-tab="tasks" class="nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800">
            Task Management
          </button>
          <button data-tab="crm" class="nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800">
            CRM &amp; Leads
          </button>
          <button data-tab="inventory" class="nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800">
            Inventory &amp; Assets
          </button>
          <button data-tab="finance" class="nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800">
            Accounts &amp; Finance
          </button>
          <button data-tab="rnd" class="nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800">
            R&amp;D Initiatives
          </button>
        </nav>
      </div>

      <div class="p-4 border-t border-slate-800 text-xs">
        <div id="current-user" class="text-slate-300 font-medium truncate mb-2"></div>
        <button
          id="logout-btn"
          class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-1.5 rounded-md transition"
        >
          Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 overflow-y-auto">
      <header class="flex items-center justify-between mb-6">
        <div>
          <h2 id="page-title" class="text-2xl font-bold text-slate-900">Executive Dashboard</h2>
          <p id="page-subtitle" class="text-sm text-slate-500">Real-time overview across all business modules</p>
        </div>
        <button
          id="refresh-btn"
          class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-sm px-3.5 py-2 rounded-lg shadow-xs"
        >
          Refresh Data
        </button>
      </header>

      <div id="content-area" class="space-y-6"></div>
    </main>
  </div>

  <script>
    const API_BASE = '/api';
    let token = localStorage.getItem('bms_token') || '';
    let activeTab = 'dashboard';

    const loginView = document.getElementById('login-view');
    const appView = document.getElementById('app-view');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const contentArea = document.getElementById('content-area');
    const pageTitle = document.getElementById('page-title');
    const pageSubtitle = document.getElementById('page-subtitle');
    const currentUserEl = document.getElementById('current-user');

    async function apiFetch(endpoint, options = {}) {
      const headers = {
        'Content-Type': 'application/json',
        ...(token ? { Authorization: `Bearer ${token}` } : {}),
        ...(options.headers || {}),
      };

      const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
      const rawText = await res.text();

      let json;
      try {
        json = JSON.parse(rawText);
      } catch {
        const snippet = rawText.replace(/\s+/g, ' ').trim().slice(0, 140);
        throw new Error(`Expected JSON from ${API_BASE}${endpoint} (HTTP ${res.status}), got: ${snippet || 'empty response'}`);
      }

      if (res.status === 401) {
        logout();
        throw new Error(json.message || json.error?.message || 'Session expired. Please log in again.');
      }

      if (!res.ok || json.success === false) {
        throw new Error(json.message || json.error?.message || `Request failed (HTTP ${res.status})`);
      }

      return json.data ?? json;
    }

    function setAuthState(isLoggedIn, user = null) {
      if (isLoggedIn) {
        loginView.classList.add('hidden');
        appView.classList.remove('hidden');
        if (user) {
          currentUserEl.textContent = `${user.full_name || user.username || user.email} (${user.role || 'User'})`;
        }
        loadTab(activeTab);
      } else {
        appView.classList.add('hidden');
        loginView.classList.remove('hidden');
      }
    }

    function logout() {
      token = '';
      localStorage.removeItem('bms_token');
      setAuthState(false);
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.classList.add('hidden');
      const identifier = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      const payload = identifier.includes('@')
        ? { email: identifier, username: identifier, password }
        : { username: identifier, password };

      try {
        const data = await apiFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify(payload),
        });
        token = data.token || data.accessToken || '';
        if (!token) {
          throw new Error('Login succeeded, but no token was returned by the server.');
        }
        localStorage.setItem('bms_token', token);
        setAuthState(true, data.user || { username: identifier });
      } catch (err) {
        loginError.textContent = err.message;
        loginError.classList.remove('hidden');
      }
    });

    document.getElementById('logout-btn').addEventListener('click', logout);
    document.getElementById('refresh-btn').addEventListener('click', () => loadTab(activeTab));

    document.querySelectorAll('.nav-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach((b) => {
          b.classList.remove('bg-indigo-600', 'text-white', 'font-medium');
          b.classList.add('hover:bg-slate-800');
        });
        btn.classList.add('bg-indigo-600', 'text-white', 'font-medium');
        btn.classList.remove('hover:bg-slate-800');
        loadTab(btn.dataset.tab);
      });
    });

    function statCard(label, value, sub = '') {
      return `
        <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-2xs">
          <div class="text-xs font-medium text-slate-500 uppercase tracking-wide">${label}</div>
          <div class="text-2xl font-bold text-slate-900 mt-1">${value ?? 0}</div>
          ${sub ? `<div class="text-xs text-slate-400 mt-1">${sub}</div>` : ''}
        </div>
      `;
    }

    function renderTable(headers, rows) {
      if (!rows || !rows.length) {
        return `<div class="bg-white rounded-xl border border-slate-200 p-6 text-sm text-slate-500">No records found.</div>`;
      }
      return `
        <div class="bg-white rounded-xl border border-slate-200 overflow-x-auto shadow-2xs">
          <table class="w-full text-left border-collapse text-sm">
            <thead class="bg-slate-50 border-b border-slate-200 text-slate-600">
              <tr>${headers.map((h) => `<th class="py-3 px-4 font-semibold">${h}</th>`).join('')}</tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              ${rows.map((r) => `<tr>${r.map((c) => `<td class="py-3 px-4">${c ?? '-'}</td>`).join('')}</tr>`).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    async function loadTab(tab) {
      activeTab = tab;
      contentArea.innerHTML = `<div class="text-sm text-slate-500">Loading ${tab}...</div>`;

      try {
        if (tab === 'dashboard') {
          pageTitle.textContent = 'Executive Dashboard';
          pageSubtitle.textContent = 'Consolidated metrics across HR, Projects, CRM, Inventory, Finance & R&D';
          const d = await apiFetch('/reports/dashboard');
          contentArea.innerHTML = `
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              ${statCard('Active Employees', d.hr?.active_employees, `Payroll: ${d.hr?.monthly_base_payroll ?? 0}`)}
              ${statCard('Active Projects', d.projects?.active_projects, `Defence: ${d.projects?.defence_projects ?? 0}`)}
              ${statCard('Open CRM Pipeline', d.crm?.open_pipeline_value, `Open Leads: ${d.crm?.open_leads ?? 0}`)}
              ${statCard('Inventory Valuation', d.inventory?.inventory_valuation, `Low Stock: ${d.inventory?.low_stock_items ?? 0}`)}
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div>
                <h3 class="text-base font-semibold text-slate-800 mb-2">Recent Audit Logs</h3>
                ${renderTable(
                  ['Actor', 'Module', 'Action', 'Entity'],
                  (d.recent_audit || []).map((a) => [a.actor_username, a.module_key, a.action, `${a.entity_type} #${a.entity_id ?? ''}`])
                )}
              </div>
              <div>
                <h3 class="text-base font-semibold text-slate-800 mb-2">Recent Notifications</h3>
                ${renderTable(
                  ['Module', 'Title', 'Message'],
                  (d.notifications || []).map((n) => [n.module_key, n.title, n.message])
                )}
              </div>
            </div>
          `;
        } else if (tab === 'hr') {
          pageTitle.textContent = 'HR & Payroll';
          pageSubtitle.textContent = 'Employee directory and workforce records';
          const list = await apiFetch('/hr/employees');
          const rows = Array.isArray(list) ? list : list.employees || [];
          contentArea.innerHTML = renderTable(
            ['ID', 'Name', 'Department', 'Designation', 'Status', 'Base Salary'],
            rows.map((e) => [e.id, e.full_name, e.department_name || e.department_id || e.department, e.designation, e.status, e.base_salary || e.basic_salary])
          );
        } else if (tab === 'projects') {
          pageTitle.textContent = 'Projects';
          pageSubtitle.textContent = 'Commercial and defence projects, budgets, and progress';
          const list = await apiFetch('/projects');
          const rows = Array.isArray(list) ? list : list.projects || [];
          contentArea.innerHTML = renderTable(
            ['ID', 'Code / Name', 'Defence', 'Status', 'Budget', 'Spent'],
            rows.map((p) => [p.id, p.name || p.title, p.is_defence_project || p.is_defence_classified ? 'Yes' : 'No', p.status, p.budget_amount || p.budget_limit, p.spent_amount])
          );
        } else if (tab === 'tasks') {
          pageTitle.textContent = 'Task Management';
          pageSubtitle.textContent = 'Tracked deliverables and execution statuses';
          const list = await apiFetch('/tasks');
          const rows = Array.isArray(list) ? list : list.tasks || [];
          contentArea.innerHTML = renderTable(
            ['ID', 'Title', 'Status', 'Priority', 'Assignee'],
            rows.map((t) => [t.id, t.title, t.status, t.priority, t.assignee_name || t.assigned_to])
          );
        } else if (tab === 'crm') {
          pageTitle.textContent = 'CRM & Leads';
          pageSubtitle.textContent = 'Sales pipeline and client opportunities';
          const list = await apiFetch('/crm/leads');
          const rows = Array.isArray(list) ? list : list.leads || [];
          contentArea.innerHTML = renderTable(
            ['ID', 'Title / Company', 'Stage', 'Estimated Value'],
            rows.map((l) => [l.id, l.title || l.company_name, l.stage, l.estimated_value])
          );
        } else if (tab === 'inventory') {
          pageTitle.textContent = 'Inventory & Assets';
          pageSubtitle.textContent = 'Stock levels, SKUs, and reorder thresholds';
          const list = await apiFetch('/inventory/items');
          const rows = Array.isArray(list) ? list : list.items || [];
          contentArea.innerHTML = renderTable(
            ['SKU', 'Item Name', 'Current Stock', 'Reorder Level', 'Unit Cost'],
            rows.map((i) => [i.sku, i.name, i.current_stock || i.stock_qty, i.reorder_level, i.unit_cost])
          );
        } else if (tab === 'finance') {
          pageTitle.textContent = 'Accounts & Finance';
          pageSubtitle.textContent = 'Accounting vouchers and ledger postings';
          const list = await apiFetch('/finance/vouchers');
          const rows = Array.isArray(list) ? list : list.vouchers || [];
          contentArea.innerHTML = renderTable(
            ['ID', 'Voucher No', 'Date', 'Status', 'Total Debit'],
            rows.map((v) => [v.id, v.voucher_no || v.reference_no, v.voucher_date, v.status, v.total_debit || v.amount])
          );
        } else if (tab === 'rnd') {
          pageTitle.textContent = 'R&D Initiatives';
          pageSubtitle.textContent = 'Research stages and allocated budgets';
          const list = await apiFetch('/rnd');
          const rows = Array.isArray(list) ? list : list.initiatives || [];
          contentArea.innerHTML = renderTable(
            ['ID', 'Title', 'Stage', 'Budget Allocated'],
            rows.map((r) => [r.id, r.title || r.name, r.stage || r.status, r.budget_allocated])
          );
        }
      } catch (err) {
        contentArea.innerHTML = `
          <div class="bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 text-sm">
            ${err.message}
          </div>
        `;
      }
    }

    if (token) {
      apiFetch('/auth/me')
        .then((user) => setAuthState(true, user.user || user))
        .catch(() => logout());
    } else {
      setAuthState(false);
    }
  </script>
</body>
</html>
